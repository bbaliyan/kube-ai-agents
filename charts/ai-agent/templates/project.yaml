apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai-agents-stack
  namespace: argocd
  finalizers:
    # Argo CD keeps the project until no Application uses it, so the finalizers of the Applications can finish.
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Before every Application that uses it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: The parent Applications of the agents and the control plane. Each agent has its own project.
  sourceRepos:
    - {{ .Values.self.repoURL | quote }}
    {{- if ne .Values.self.repoURL .Values.substrate.repoURL }}
    - {{ .Values.substrate.repoURL | quote }}
    {{- end }}
  destinations:
    {{- /* Also the namespace of each agent: the parent of an agent makes the Role of its deployment account there. */}}
    {{- $namespaces := list "argocd" .Values.substrate.namespace }}
    {{- range include "ai-agent.agents" . | fromJsonArray }}{{ $namespaces = append $namespaces .namespace }}{{ end }}
    {{- range $namespaces | uniq }}
    - server: https://kubernetes.default.svc
      namespace: {{ . }}
    {{- end }}
  clusterResourceWhitelist:
    {{- range .Values.clusterResources }}
    - group: {{ .group | quote }}
      kind: {{ .kind }}
    {{- end }}
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
{{- range include "ai-agent.agents" . | fromJsonArray }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  # The prefix keeps the name apart from projects that exist for other uses, such as default.
  name: ai-agent-{{ .name }}
  namespace: argocd
  finalizers:
    # Argo CD keeps the project until no Application uses it, so the finalizers of the Applications can finish.
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Below the wave of the Application of the agent (1). On sync the project exists before its
    # Applications. On removal Argo CD prunes the higher wave first, so the Applications and their
    # finalizers and hooks still find the namespace permitted. One shared project lost it too early.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: The agent {{ .name }}
  sourceRepos:
    - {{ $.Values.self.repoURL | quote }}
    {{- if ne $.Values.self.repoURL $.Values.substrate.repoURL }}
    - {{ $.Values.substrate.repoURL | quote }}
    {{- end }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: {{ .namespace }}
    # The registration and idle suspend charts put a Role and a RoleBinding here, so the Job and the CronJob can reach the control plane.
    - server: https://kubernetes.default.svc
      namespace: {{ $.Values.substrate.namespace }}
  # With application sync impersonation on, Argo CD deploys every Application of this project with this account,
  # wherever the Application points. The chart agent makes the account and its rights.
  destinationServiceAccounts:
    - server: "*"
      namespace: "*"
      defaultServiceAccount: argocd:{{ .name }}-deployer
  # No child of an agent makes a cluster-scoped object. The control plane does, and it uses the shared project.
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
{{- end }}
