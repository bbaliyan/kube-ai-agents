apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai-agent
  namespace: argocd
  annotations:
    # Before every Application that uses it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: The parent Applications of the agents and the control plane. Each agent has its own project.
  sourceRepos:
    - {{ .Values.self.repoURL | quote }}
    {{- if ne .Values.self.repoURL .Values.substrate.repoURL }}
    - {{ .Values.substrate.repoURL | quote }}
    {{- end }}
  destinations:
    {{- $namespaces := list "argocd" .Values.substrate.namespace }}
    {{- range $namespaces | uniq }}
    - server: https://kubernetes.default.svc
      namespace: {{ . }}
    {{- end }}
  clusterResourceWhitelist:
    {{- range .Values.clusterResources }}
    - group: {{ .group | quote }}
      kind: {{ .kind }}
    {{- end }}
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
{{- range include "ai-agent.agents" . | fromJsonArray }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .name }}
  namespace: argocd
  annotations:
    # Below the wave of the Application of the agent (1). On sync the project exists before its
    # Applications. On removal Argo CD prunes the higher wave first, so the Applications and their
    # finalizers and hooks still find the namespace permitted. One shared project lost it too early.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: The agent {{ .name }}
  sourceRepos:
    - {{ $.Values.self.repoURL | quote }}
    {{- if ne $.Values.self.repoURL $.Values.substrate.repoURL }}
    - {{ $.Values.substrate.repoURL | quote }}
    {{- end }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: {{ .namespace }}
  clusterResourceWhitelist:
    {{- range $.Values.clusterResources }}
    - group: {{ .group | quote }}
      kind: {{ .kind }}
    {{- end }}
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
{{- end }}
