{{- $a := .Values.agent }}
{{- if and $a.dashboard.enabled (not $a.metricsCollector.enabled) }}{{ fail "agent.dashboard.enabled needs agent.metricsCollector.enabled: the dashboard reads the metrics of the collector" }}{{ end }}
{{- if $a.metricsCollector.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{- include "agent.application" (dict "suffix" "metrics" "wave" 0 "root" $) | nindent 0 }}
  source:
    repoURL: {{ .Values.self.repoURL | quote }}
    targetRevision: {{ .Values.self.revision | quote }}
    path: charts/pr-agent-metrics
    helm:
      releaseName: {{ $a.name }}-metrics
      valuesObject:
        {{- $given := $a.metricsApiKeySecret -}}
        {{- $secret := dict "generateToken" (not $given) "secret" (dict "name" (default "pr-agent-metrics" $given.name) "key" (default "password" $given.key)) -}}
        {{- $dashboard := dict "dashboard" (dict "enabled" $a.dashboard.enabled "name" $a.name "actor" (printf "%s/%s" $a.atespace $a.actorName)) -}}
        {{- mergeOverwrite (deepCopy $a.metricsCollector.helmValues) $secret $dashboard | toYaml | nindent 8 }}
  destination:
    {{- include "agent.destination" $a | nindent 4 }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The ServiceMonitor CRD comes from the platform, which may still be starting.
    retry:
      limit: 10
      backoff:
        duration: 1m
        maxDuration: 10m
{{- end }}
