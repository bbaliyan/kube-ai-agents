{{- /*
The account that Argo CD deploys the Applications of this agent with, when application sync impersonation is on. The
project of the agent names it for every destination. It lives in argocd, where no Application of the agent can make a
Pod, so nothing that the agent deploys can run as it. The parent of the agent makes it before the Applications (wave -1)
and Argo CD removes it after them, because their finalizers delete with this account too.
*/ -}}
{{- $name := printf "%s-deployer" .Values.agent.name -}}
{{- $namespace := required "agent.namespace is required" .Values.agent.namespace -}}
{{- /* The names that the charts substrate-registration and substrate-idle-suspend give their Role and RoleBinding. */ -}}
{{- $controlPlaneRoles := list -}}
{{- range list (list "registration" "substrate-registration") (list "idle-suspend" "substrate-idle-suspend") -}}
{{- $release := printf "%s-%s" $.Values.agent.name (index . 0) -}}
{{- $chart := index . 1 -}}
{{- $full := ternary $release (printf "%s-%s" $release $chart) (contains $chart $release) -}}
{{- $controlPlaneRoles = append $controlPlaneRoles ($full | trunc 40 | trimSuffix "-") -}}
{{- end -}}
{{- $manage := list "get" "list" "watch" "create" "update" "patch" "delete" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
---
# What the charts of an agent make in its own namespace. No Secrets, no Roles.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: [configmaps, serviceaccounts, services]
    verbs: {{ toJson $manage }}
  - apiGroups: [apps]
    resources: [deployments]
    verbs: {{ toJson $manage }}
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: {{ toJson $manage }}
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: {{ toJson $manage }}
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: {{ toJson $manage }}
  - apiGroups: [generators.external-secrets.io]
    resources: [passwords]
    verbs: {{ toJson $manage }}
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors]
    verbs: {{ toJson $manage }}
  - apiGroups: [traefik.io]
    resources: [ingressroutes]
    verbs: {{ toJson $manage }}
---
# In the namespace of the control plane an agent only makes the two Roles of its Jobs, and their bindings. Kubernetes
# lets an account grant only what it holds, so it holds the three rules of those Roles and neither bind nor escalate.
# It reads, changes and deletes only its own Roles. A rule that a chart adds to its Role must be added here too, or
# the sync fails.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Values.substrate.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  # Argo CD applies a Role with kubectl auth reconcile, which reads the namespace first.
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [{{ .Values.substrate.namespace }}]
    verbs: [get]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    resourceNames: {{ toJson $controlPlaneRoles }}
    verbs: [get, update, patch, delete]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [api]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [get, create]
{{- range list $namespace .Values.substrate.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: argocd
{{- end }}
{{- $user := printf "system:serviceaccount:argocd:%s" $name }}
{{- /* RBAC cannot say who a binding may name, or where a route may point. These two policies apply to this account only. */}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}-bindings
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: ["*"]
        resources: [rolebindings]
        operations: [CREATE, UPDATE]
  matchConditions:
    - name: the-deployment-account
      expression: {{ printf "request.userInfo.username == '%s'" $user | quote }}
  validations:
    - expression: {{ printf "object.roleRef.kind == 'Role' && object.roleRef.name in %s" (toJson $controlPlaneRoles) | quote }}
      message: the deployment account of an agent binds only the two Roles of the agent
    - expression: {{ printf "has(object.subjects) && object.subjects.all(s, s.kind == 'ServiceAccount' && has(s.namespace) && s.namespace == '%s')" $namespace | quote }}
      message: the deployment account of an agent binds only to service accounts of the namespace of the agent
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}-routes
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [traefik.io]
        apiVersions: ["*"]
        resources: [ingressroutes]
        operations: [CREATE, UPDATE]
  matchConditions:
    - name: the-deployment-account
      expression: {{ printf "request.userInfo.username == '%s'" $user | quote }}
  validations:
    # Only Services of the namespace of the route: no other namespace, and no TraefikService such as api@internal.
    - expression: >-
        object.spec.routes.all(r,
        (!has(r.services) || r.services.all(s, (!has(s.kind) || s.kind == 'Service') && (!has(s.namespace) || s.namespace == object.metadata.namespace)))
        && (!has(r.middlewares) || r.middlewares.all(m, !has(m.namespace) || m.namespace == object.metadata.namespace)))
      message: a route of an agent uses only Services and Middlewares of its own namespace
{{- range list "bindings" "routes" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}-{{ . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyName: {{ $name }}-{{ . }}
  validationActions: [Deny]
{{- end }}
