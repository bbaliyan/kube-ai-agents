{{- if .Values.actors }}
{{- /* What kubectl-ate needs to reach ate-api-server: read the Service, list its pods and port-forward to one. */ -}}
{{- $sa := include "substrate-idle-suspend.serviceAccountName" . -}}
{{- $name := include "substrate-idle-suspend.fullname" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  labels:
    {{- include "substrate-idle-suspend.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Values.substrate.namespace }}
  labels:
    {{- include "substrate-idle-suspend.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services]
    resourceNames: [api]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Values.substrate.namespace }}
  labels:
    {{- include "substrate-idle-suspend.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
