{{- $name := "pr-agent-metrics" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/name: {{ $name }}}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: collector
          image: {{ .Values.image }}
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - {name: otlp, containerPort: {{ .Values.otlpPort }}}
            - {name: metrics, containerPort: {{ .Values.metricsPort }}}
          readinessProbe:
            httpGet: {path: /, port: 13133}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: config, mountPath: /etc/otel, readOnly: true}
            - {name: secret, mountPath: /secrets, readOnly: true}
      volumes:
        - name: config
          configMap: {name: {{ $name }}}
        - name: secret
          secret:
            secretName: {{ .Values.secret.name }}
            items: [{key: {{ .Values.secret.key }}, path: token}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/name: {{ $name }}}
spec:
  selector: {app.kubernetes.io/name: {{ $name }}}
  ports:
    - {name: otlp, port: {{ .Values.otlpPort }}, targetPort: otlp}
    - {name: metrics, port: {{ .Values.metricsPort }}, targetPort: metrics}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  policyTypes: [Ingress]
  ingress:
    - from: {{ toYaml .Values.allowOtlpFrom | nindent 8 }}
      ports: [{port: {{ .Values.otlpPort }}, protocol: TCP}]
    - from: {{ toYaml .Values.allowScrapeFrom | nindent 8 }}
      ports: [{port: {{ .Values.metricsPort }}, protocol: TCP}]
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  endpoints:
    - port: metrics
      interval: 30s
      # The labels of the metrics are the truth. Do not replace them with the ones of the target.
      honorLabels: true
  sampleLimit: {{ .Values.serviceMonitor.sampleLimit }}
{{- end }}
