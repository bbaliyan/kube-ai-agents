{{- $name := "pr-agent-metrics" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/name: {{ $name }}}
data:
  config.yaml: |
    extensions:
      bearertokenauth:
        filename: /secrets/token
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:{{ .Values.otlpPort }}
            auth:
              authenticator: bearertokenauth
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 128
      # Keep only the metrics of pr-agent. A client that holds the token cannot add other series.
      filter/pr_agent:
        metrics:
          metric:
            - 'not IsMatch(name, "^pr_agent[.]")'
      # The actor names itself in the resource attribute ate.actor, and each gunicorn worker names itself in
      # service.instance.id (charts/agent/files/actor_patch.py). Copy those two to datapoint attributes: a label
      # per actor, and a label per worker so that the workers do not overwrite each other. Sum over `worker` to
      # read an actor. After a restart of a worker, its old series stays until metricExpiration. A gauge that is
      # stuck above 0 in it, or after a suspend in the middle of a command, is capped by the idle suspend (see its
      # busy signal), so metricExpiration stays long enough for the counters.
      transform/actor:
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["ate.actor"], resource.attributes["ate.actor"]) where resource.attributes["ate.actor"] != nil
              - set(attributes["worker"], resource.attributes["service.instance.id"]) where resource.attributes["service.instance.id"] != nil
    exporters:
      prometheus:
        endpoint: 0.0.0.0:{{ .Values.metricsPort }}
        metric_expiration: {{ .Values.metricExpiration }}
      # pr-agent sends traces with the metrics. Nothing stores them, so they end here.
      nop:
    service:
      extensions: [bearertokenauth, health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, filter/pr_agent, transform/actor]
          exporters: [prometheus]
        traces:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [nop]
