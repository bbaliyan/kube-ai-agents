# The namespace of the control plane.
controlPlaneNamespace: ate-system

# The credential provider reads a Secret only in a namespace that the atespace of the actor may use. The install
# makes this policy empty, and only when it is missing, so it is made here, before the install. The provider reads
# it once at start. One entry for each agent.
agents: []
