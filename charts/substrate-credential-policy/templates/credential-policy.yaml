{{- if .Values.agents }}
{{- $namespacesByAtespace := dict }}
{{- range .Values.agents }}
{{- $_ := set $namespacesByAtespace .atespace (append (get $namespacesByAtespace .atespace | default list) .namespace | uniq) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-credential-provider-namespace-policy
  namespace: {{ .Values.controlPlaneNamespace }}
data:
  namespace-policy.yaml: |
    policies:
    {{- range $atespace := keys $namespacesByAtespace | sortAlpha }}
    - atespace: {{ $atespace }}
      allowedNamespaces:
      {{- range get $namespacesByAtespace $atespace | sortAlpha }}
      - {{ . }}
      {{- end }}
    {{- end }}
{{- end }}
