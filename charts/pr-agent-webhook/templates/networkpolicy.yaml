{{- if not .Values.allowFrom }}
{{- fail "allowFrom is empty. List every sender that may call the shim, for example the GitLab pods, or the pods of the ingress controller when ingressRoute is on. See the README, Who can call the shim." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pr-agent-webhook.name" $ }}
  labels:
    {{- include "pr-agent-webhook.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pr-agent-webhook.selector" $ | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.allowFrom | nindent 8 }}
      ports:
        - port: {{ $.Values.port }}
          protocol: TCP
