apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: substrate-credential-policy
  namespace: argocd
  annotations:
    # Before the install: the credential provider reads the policy once at start.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: ai-agent
  source:
    repoURL: {{ .Values.self.repoURL | quote }}
    targetRevision: {{ .Values.self.revision | quote }}
    path: charts/substrate-credential-policy
    helm:
      valuesObject:
        controlPlaneNamespace: {{ .Values.substrate.namespace }}
        podMonitoringCrdStub: {{ .Values.substrate.podMonitoringCrdStub }}
        agents:
          {{- range .Values.agents }}
          - atespace: {{ .atespace }}
            namespace: {{ .namespace }}
          {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.substrate.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 1m
        maxDuration: 10m
