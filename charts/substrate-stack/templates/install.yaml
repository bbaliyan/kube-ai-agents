apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: substrate-install
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: ai-agents-stack
  source:
    repoURL: {{ .Values.substrate.repoURL | quote }}
    targetRevision: {{ .Values.substrate.revision | quote }}
    path: charts/substrate-install
    helm:
      valuesObject:
        {{- /* The control plane trusts the registration service account of each agent. */ -}}
        {{- $owners := list (printf "system:serviceaccount:%s:ate-client" .Values.substrate.namespace) -}}
        {{- $shims := list -}}
        {{- range .Values.agents }}
        {{- $owners = append $owners (printf "system:serviceaccount:%s:%s-registration" .namespace .name) -}}
        {{- if .webhook }}{{- $shims = append $shims (printf "spiffe://cluster.local/ns/%s/sa/%s-webhook" .namespace .name) -}}{{- end }}
        {{- end }}
        {{- $install := dict
          "image" (dict "digest" .Values.substrate.installImageDigest)
          "storage" (dict
            "profile" "s3-compatible"
            "bucket" .Values.substrate.bucket
            "region" "us-east-1"
            "s3Compatible" (dict
              "endpoint" .Values.substrate.s3Endpoint
              "pathStyle" true
              "credentials" (dict "secretName" "snapshot-store-keys")))
          "selinux" (dict "enabled" true "type" "container_engine_t" "level" .Values.substrate.selinuxLevel)
          "config" (dict
            "clusterSize" "size0"
            "preview" "PerTemplateSnapshotLocation"
            "ateapi" (dict "authz" (dict "bootstrapOwners" (join "," $owners)))
            "atenet" (dict "egress" (dict "credentialProvider" (ternary "{\"name\":\"k8s.io\"}" "{\"enabled\":false}" (gt (len .Values.agents) 0)))))
          "postgres" (dict
            "resources" (dict "requests" (dict "cpu" "250m" "memory" "512Mi") "limits" (dict "cpu" "2" "memory" "2Gi"))
            "storage" "10Gi") -}}
        {{- $consumer := deepCopy .Values.substrate.install.helmValues -}}
        {{- if $shims }}
        {{- /* The shim identities come first. A consumer allow-list is appended. */ -}}
        {{- $extra := dig "config" "ingressAllowedSPIFFEIDs" "" $consumer -}}
        {{- $_ := set (get $install "config") "ingressAllowedSPIFFEIDs" (join "," (concat $shims (ternary (list) (list $extra) (eq $extra "")))) -}}
        {{- if hasKey $consumer "config" }}{{- $_ := unset (get $consumer "config") "ingressAllowedSPIFFEIDs" -}}{{- end }}
        {{- end }}
        {{- mergeOverwrite $install $consumer | toYaml | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.substrate.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 2m
        maxDuration: 10m
