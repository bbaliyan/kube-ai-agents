{{- $idle := false }}
{{- range .Values.agents }}{{ if .idleSuspend }}{{ $idle = true }}{{ end }}{{ end }}
{{- if $idle }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: substrate-monitors
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: ai-agent
  source:
    repoURL: {{ .Values.substrate.repoURL | quote }}
    targetRevision: {{ .Values.substrate.revision | quote }}
    path: charts/substrate-idle-suspend
    helm:
      releaseName: substrate-monitors
      valuesObject:
        substrate:
          namespace: {{ .Values.substrate.namespace }}
        podMonitors:
          enabled: true
          labels:
            {{- toYaml .Values.substrate.podMonitorLabels | nindent 12 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.substrate.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 2m
        maxDuration: 10m
{{- end }}
