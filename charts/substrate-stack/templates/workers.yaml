apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: substrate-workers
  namespace: argocd
  finalizers:
    # Deleting the Application deletes what it made. Without it, Argo CD leaves its objects behind.
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: ai-agents-stack
  source:
    repoURL: {{ .Values.substrate.repoURL | quote }}
    targetRevision: {{ .Values.substrate.revision | quote }}
    path: charts/substrate-workers
    helm:
      valuesObject:
        {{- $workers := dict
          "pool" (dict "name" "gvisor" "nodeSelector" .Values.substrate.nodeSelector)
          "workers" (dict
            "replicas" .Values.substrate.workers.replicas
            "cpu" (.Values.substrate.workers.cpu | toString)
            "memory" .Values.substrate.workers.memory)
          "selinux" (dict "enabled" true "type" "container_engine_t") -}}
        {{- /* The idle suspend reads the metrics of the control plane, which upstream scrapes only on GKE. */ -}}
        {{- range .Values.agents }}{{ if .idleSuspend }}{{ $_ := set $workers "observability" (dict "enabled" true "podMonitorLabels" $.Values.substrate.podMonitorLabels) }}{{ end }}{{ end }}
        {{- mergeOverwrite $workers .Values.substrate.workers.helmValues | toYaml | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.substrate.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 2m
        maxDuration: 10m
