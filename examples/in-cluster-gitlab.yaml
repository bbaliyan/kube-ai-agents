# One agent that reviews merge requests of an in-cluster GitLab with a model on the local network.
# Every host name is an example. The consumer sets its own.
substrate:
  s3Endpoint: http://s3.example.test:9000
  nodeSelector:
    example.test/node-group: general

agents:
  - name: pr-agent
    type: pr-agent
    atespace: reviews
    namespace: pr-agent
    model: ollama/example-model:30b
    modelEndpoint: http://model.example.test:11434
    gitlabUrl: http://gitlab.example.test
    webhook:
      port: 8080
      # The labels of the GitLab Helm chart. Sidekiq sends webhooks, and the web service sends some, such
      # as a test from the UI. Other installs use other labels, so check your Pods. A CI job that uses the
      # pipeline route calls the shim from its own Pod, or through an ingress controller: add that sender too.
      allowFrom:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitlab
          podSelector:
            matchLabels:
              app: sidekiq
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitlab
          podSelector:
            matchLabels:
              app: webservice
      pipeline:
        enabled: true
        issuer: https://gitlab.example.test
        jwksUri: http://gitlab.example.test/oauth/discovery/keys
        namespacePaths: [mirror]
    metricsCollector:
      enabled: true
    idleSuspend:
      enabled: true
      prometheusUrl: http://prometheus.example.test:9090
